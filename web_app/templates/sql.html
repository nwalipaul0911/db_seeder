<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SQL Workspace | DB Seeder</title>
    <style>
      :root {
        --ink: #172121;
        --muted: #687373;
        --paper: #f4f6f1;
        --surface: #fff;
        --line: #d9dfd8;
        --accent: #e75d3f;
        --teal: #137c72;
        --code: #172525;
      }
      * { box-sizing: border-box; }
      body {
        min-width: 320px;
        margin: 0;
        color: var(--ink);
        background: var(--paper);
        background-image: linear-gradient(rgba(23, 33, 33, .035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(23, 33, 33, .035) 1px, transparent 1px);
        background-size: 28px 28px;
        font-family: 'Trebuchet MS', sans-serif;
      }
      main { width: min(1220px, calc(100% - 32px)); margin: 32px auto; }
      .topbar, .panel { background: rgba(255, 255, 255, .96); border: 1px solid var(--line); border-radius: 12px; }
      .topbar { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 24px 28px; }
      h1 { margin: 0; font-size: clamp(1.8rem, 4vw, 3.2rem); letter-spacing: -.04em; }
      .eyebrow { margin: 0 0 7px; color: #bd4029; font: 500 11px/1.2 monospace; letter-spacing: .12em; text-transform: uppercase; }
      a { color: var(--teal); font-weight: 700; }
      .workspace { display: grid; grid-template-columns: minmax(230px, .7fr) minmax(0, 1.8fr); gap: 18px; margin-top: 18px; }
      .panel { padding: 22px; }
      .panel h2 { margin: 0 0 16px; font-size: 1rem; }
      .table-list { display: grid; gap: 6px; max-height: 320px; margin-top: 20px; overflow-y: auto; padding-right: 4px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
      .table-list button { display: flex; align-items: center; justify-content: space-between; min-height: 38px; padding: 8px 10px; border-color: var(--line); background: #f7f9f6; color: var(--ink); text-align: left; font: 13px/1.3 monospace; }
      .table-list button:hover, .table-list button[aria-current="true"] { border-color: var(--teal); background: #e8f4ef; color: #075e55; }
      .table-count { color: var(--muted); font-size: 11px; }
      label { display: block; margin-bottom: 7px; color: var(--muted); font-size: .75rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
      select, textarea, button { width: 100%; border: 1px solid var(--line); border-radius: 8px; font: inherit; }
      select, button { min-height: 44px; padding: 10px 12px; }
      select { background: var(--surface); color: var(--ink); }
      textarea { min-height: 230px; padding: 16px; resize: vertical; background: var(--code); color: #dceae3; font: 13px/1.6 monospace; }
      textarea:focus, select:focus, button:focus-visible { outline: 3px solid rgba(231, 93, 63, .2); outline-offset: 2px; border-color: var(--accent); }
      button { border-color: transparent; background: var(--accent); color: white; cursor: pointer; font-weight: 800; }
      button:hover { background: #bd4029; }
      .secondary { margin-top: 10px; border-color: var(--line); background: var(--surface); color: var(--ink); }
      .secondary:hover { background: #f0f3ee; }
      .hint, #status { color: var(--muted); font-size: .82rem; line-height: 1.5; }
      #status { min-height: 1.4em; margin: 12px 0 0; }
      #status.error { color: #92341f; }
      #status.success { color: #075e55; }
      .results { margin-top: 18px; overflow: hidden; }
      .results-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
      .results-head h2 { margin-bottom: 4px; }
      .table-wrap { max-height: 480px; margin-top: 16px; overflow: auto; border: 1px solid var(--line); }
      table { width: 100%; border-collapse: collapse; font: 13px/1.45 monospace; background: white; }
      th, td { padding: 10px 12px; border-bottom: 1px solid #e9ede8; text-align: left; vertical-align: top; white-space: pre-wrap; }
      th { position: sticky; top: 0; background: #edf2ec; color: var(--ink); }
      .empty { padding: 22px; color: var(--muted); }
      @media (max-width: 760px) {
        main { width: min(100% - 20px, 680px); margin: 10px auto; }
        .topbar { align-items: flex-start; flex-direction: column; padding: 20px; }
        .workspace { grid-template-columns: 1fr; }
        .panel { padding: 18px; }
      }
    </style>
  </head>
  <body>
    <main>
      <header class="topbar">
        <div>
          <p class="eyebrow">DB Seeder / Read-only</p>
          <h1>SQL workspace</h1>
        </div>
        <a href="/seeder">Back to seeder</a>
      </header>

      <section class="workspace">
        <aside class="panel">
          <h2>Choose a generated database</h2>
          <label for="run">Run</label>
          <select id="run"><option value="">Loading runs...</option></select>
          <h2>Tables</h2>
          <div id="tableList" class="table-list"><p class="hint">Select a database to see its tables.</p></div>
        </aside>

        <section class="panel">
          <h2>Query</h2>
          <label for="query">Read-only SQL</label>
          <textarea id="query" spellcheck="false">SELECT name FROM sqlite_master WHERE type = 'table' ORDER BY name;</textarea>
          <button id="runQuery" type="button">Run query</button>
          <p id="status" role="status"></p>
        </section>
      </section>

      <section class="panel results" aria-live="polite">
        <div class="results-head">
          <h2>Results</h2>
          <span class="hint" id="rowCount"></span>
        </div>
        <div id="resultArea" class="empty">Run a query to inspect the selected database.</div>
      </section>
    </main>
    <script>
      const runSelect = document.getElementById('run');
      const queryInput = document.getElementById('query');
      const status = document.getElementById('status');
      const resultArea = document.getElementById('resultArea');
      const rowCount = document.getElementById('rowCount');
      const tableList = document.getElementById('tableList');

      function setStatus(message, kind = '') {
        status.textContent = message;
        status.className = kind;
      }

      function formatRun(run) {
        const counts = Object.entries(run.row_counts || {})
          .map(([table, count]) => `${table}: ${count}`)
          .join(' | ');
        return counts || 'No row counts available';
      }

      function quoteIdentifier(identifier) {
        return `"${identifier.replaceAll('"', '""')}"`;
      }

      function renderTables(run) {
        tableList.replaceChildren();
        const tables = Object.entries(run?.row_counts || {});
        if (!tables.length) {
          const empty = document.createElement('p');
          empty.className = 'hint';
          empty.textContent = 'No tables found for this database.';
          tableList.appendChild(empty);
          return;
        }
        tables.forEach(([tableName, count]) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.dataset.table = tableName;
          button.innerHTML = `<span></span><span class="table-count"></span>`;
          button.firstElementChild.textContent = tableName;
          button.lastElementChild.textContent = count;
          button.addEventListener('click', () => {
            document.querySelectorAll('#tableList button').forEach((item) => item.removeAttribute('aria-current'));
            button.setAttribute('aria-current', 'true');
            queryInput.value = `SELECT * FROM ${quoteIdentifier(tableName)};`;
          });
          tableList.appendChild(button);
        });
      }

      function renderResults(data) {
        rowCount.textContent = `${data.row_count} row${data.row_count === 1 ? '' : 's'}`;
        if (!data.columns.length) {
          resultArea.textContent = 'The query returned no columns.';
          resultArea.className = 'empty';
          return;
        }
        const table = document.createElement('table');
        const head = document.createElement('tr');
        data.columns.forEach((column) => {
          const cell = document.createElement('th');
          cell.textContent = column;
          head.appendChild(cell);
        });
        const thead = document.createElement('thead');
        thead.appendChild(head);
        const tbody = document.createElement('tbody');
        data.rows.forEach((row) => {
          const line = document.createElement('tr');
          data.columns.forEach((column) => {
            const cell = document.createElement('td');
            const value = row[column];
            cell.textContent = value === null ? 'NULL' : typeof value === 'object' ? JSON.stringify(value) : String(value);
            line.appendChild(cell);
          });
          tbody.appendChild(line);
        });
        table.append(thead, tbody);
        resultArea.replaceChildren(table);
        resultArea.className = 'table-wrap';
      }

      async function loadRuns() {
        try {
          const response = await fetch('/api/sql/runs');
          if (!response.ok) throw new Error('Could not load database runs.');
          const runs = await response.json();
          runSelect.replaceChildren();
          runs.forEach((run) => {
            const option = document.createElement('option');
            option.value = `${run.schema_key}/${run.run_id}`;
            option.textContent = run.label;
            option.dataset.details = formatRun(run);
            option.dataset.tables = JSON.stringify(run.row_counts || {});
            runSelect.appendChild(option);
          });
          if (!runs.length) {
            runSelect.add(new Option('No generated runs found', ''));
          }
          renderTables(runs[0]);
        } catch (error) {
          runSelect.replaceChildren(new Option('Unable to load runs', ''));
          renderTables(null);
          setStatus(error.message, 'error');
        }
      }

      runSelect.addEventListener('change', () => {
        const option = runSelect.selectedOptions[0];
        renderTables(option ? { row_counts: JSON.parse(option.dataset.tables || '{}') } : null);
      });

      async function executeQuery() {
        if (!runSelect.value) return setStatus('Select a generated database first.', 'error');
        setStatus('Running query...');
        try {
          const response = await fetch('/api/sql/query', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ run: runSelect.value, query: queryInput.value })
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || 'Query failed.');
          renderResults(data);
          setStatus('Query complete.', 'success');
        } catch (error) {
          setStatus(error.message, 'error');
          rowCount.textContent = '';
        }
      }

      document.getElementById('runQuery').addEventListener('click', executeQuery);

      loadRuns();
    </script>
  </body>
</html>
